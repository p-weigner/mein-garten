name: OpenPlantbook HA-Skript prüfen

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/openplantbook-skript-pruefen.yml"
      - "qa/**"
      - "tests/manual/Mein_Garten_OpenPlantbook_Pflegepruefung.yaml"

permissions:
  contents: read

jobs:
  yaml-und-templates:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python 3.12 installieren
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: YAML- und Jinja-Prüfer installieren
        run: python -m pip install "PyYAML==6.0.2" "Jinja2==3.1.6"
      - name: Home-Assistant-Skript lokal simulieren
        run: python -m unittest discover -s qa -v
