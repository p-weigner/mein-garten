name: HACS und Home Assistant – Repositoryvalidierung

on:
  push:
    branches: [main]
    paths:
      - "custom_components/mein_garten/**"
      - "hacs.json"
      - ".github/workflows/hacs-validierung.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    runs-on: ubuntu-latest
    steps:
      - name: HACS Repositoryvalidierung (Typ Integration)
        uses: hacs/action@main
        with:
          category: integration

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Home Assistant Manifest und Struktur prüfen
        uses: home-assistant/actions/hassfest@master
