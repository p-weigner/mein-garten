name: Pflegequellen-Prüfung

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/pflegequellen.yml"
      - "tools/pflegequellen_live.py"
      - "tools/pflegeprofil_qualitaet.py"
      - "tests/test_pflegeprofil_qualitaet.py"

permissions:
  contents: read

jobs:
  pflegepruefung:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PERMAPEOPLE_KEY_ID: ${{ secrets.PERMAPEOPLE_KEY_ID }}
      PERMAPEOPLE_KEY_SECRET: ${{ secrets.PERMAPEOPLE_KEY_SECRET }}
      AZURE_TRANSLATOR_KEY: ${{ secrets.AZURE_TRANSLATOR_KEY }}
      AZURE_TRANSLATOR_REGION: ${{ secrets.AZURE_TRANSLATOR_REGION }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Modul- und Sicherheitstests
        run: python -m unittest discover -s tests -v
      - name: Optionale Live-Abfragen ohne Veröffentlichung der Quelltexte
        run: python -m tools.pflegequellen_live
      - name: Bericht bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mein-garten-pflegequellen
          path: |
            berichte/pflegequellen.json
            berichte/pflegequellen.md
          if-no-files-found: warn
          retention-days: 15
